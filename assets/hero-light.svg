  <text x="1216" y="86" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="1.2" fill="#6B7788">~/3rlaitz</text>

