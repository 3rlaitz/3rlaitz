  <text x="64" y="225" font-family="'Inter', -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" letter-spacing="0.2" fill="#5B6675">Web · APIs REST · .NET · Java</text>

