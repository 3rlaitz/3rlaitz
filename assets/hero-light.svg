<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none" role="img" aria-label="Erlaitz Alonso — Desarrollador de software">
  <defs>
    <clipPath id="cardClip"><rect x="0.5" y="0.5" width="1279" height="359" rx="16"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F8FA"/>
      <stop offset="1" stop-color="#F1F3F6"/>
    </linearGradient>
    <radialGradient id="glow" cx="1060" cy="10" r="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F766E" stop-opacity="0.1"/>
      <stop offset="0.55" stop-color="#0F766E" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#0F766E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#0B0F14" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="white" stop-opacity="0.7"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <mask id="gridMask">
      <rect width="1280" height="360" fill="url(#gridFade)"/>
    </mask>
  </defs>

  <g clip-path="url(#cardClip)">
