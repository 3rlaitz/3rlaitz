    <rect width="1280" height="360" fill="url(#grid)" mask="url(#gridMask)"/>
    <rect width="1280" height="360" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="16" fill="none" stroke="#E3E8EF"/>

  <g stroke="#0F766E" stroke-opacity="0.28">
    <path d="M24 48V24H48"/>
    <path d="M1232 24H1256V48"/>
