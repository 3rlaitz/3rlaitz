  <text x="1068" y="340" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="1.8" fill="#6B7788">43.3202° N · 3.0287° W</text>
